networks:
  hosting:
    external: true

services:
  cloudflare_tunnel:
    image: cloudflare/cloudflared:2026.10.4
    container_name: cloudflare_tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?Cloudflare tunnel token required}
    command: tunnel --no-autoupdate run
    networks:
      - hosting
