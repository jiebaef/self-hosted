networks:
  hosting:
    external: true

services:
  openproject:
    container_name: openproject
    image: openproject/openproject:16
    ports:
      - 8080:80
    environment:
      - OPENPROJECT_HOST__NAME=${OPENPROJECT_HOST_NAME:?OpenProject public hostname required}
      - OPENPROJECT_SECRET_KEY_BASE=${OPENPROJECT_SECRET_KEY_BASE:?OpenProject secret key required}
      - OPENPROJECT_HTTPS=${OPENPROJECT_HTTPS:-false}
    volumes:
      - ${OPENPROJECT_DATA_PATH:-/mnt/files/docker_data/openproject}/pgdat/pgdataa:/var/openproject/pgdata
      - ${OPENPROJECT_DATA_PATH:-/mnt/files/docker_data/openproject}/assets:/var/openproject/assets
    networks:
      - hosting
