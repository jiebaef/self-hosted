networks:
  hosting:
    external: true

services:
  openproject:
    container_name: openproject
    image: openproject/openproject:16
    ports:
      - 8080:80
    environment:
      - OPENPROJECT_HOST__NAME=openproject.sh-jiebaef.xyz
      - OPENPROJECT_SECRET_KEY_BASE=secret
      - OPENPROJECT_HTTPS=false 
    volumes:
      - /mnt/files/docker_data/openproject/pgdat/pgdataa:/var/openproject/pgdata
      - /mnt/files/docker_data/openproject/assets:/var/openproject/assets
    networks:
      - hosting
