networks:
  hosting:
    external: true

services:
  filebrowser:
    image: gtstef/filebrowser:beta-slim
    container_name: filebrowser
    environment:
      FILEBROWSER_CONFIG: "data/config.yaml"
      FILEBROWSER_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?admin password required}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - "${FILEBROWSER_PRIVATE_PATH:-/mnt/files/Filebrowser/_private}:/srv/_private"
      - "${FILEBROWSER_FHDW_PATH:-/mnt/files/Filebrowser/fhdw}:/srv/fhdw"
      - "${FILEBROWSER_USERS_PATH:-/mnt/files/Filebrowser/users}:/srv/users"
      - "${MEDIA_ANIME_PATH:-/mnt/files/Mediaserver/Anime}:/srv/Media/Anime"
      - "${MEDIA_SHOWS_PATH:-/mnt/files/Mediaserver/Shows}:/srv/Media/Shows"
      - "${MEDIA_MOVIES_PATH:-/mnt/files/Mediaserver/Movies}:/srv/Media/Movies"
      - "./data:/home/filebrowser/data"
      - "./tmp/:/home/filebrowser/tmp/"
    # ports:
    #   - '80:80' # the left 80 is the port **you will use** to access. The right 80 is the container port that **must match the config.yaml**
    # user: filebrowser
    restart: unless-stopped
    networks:
      - hosting
