networks:
  hosting:
    external: true
  content_consumption:
    external: true

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.0
    container_name: audiobookshelf
    restart: unless-stopped
    volumes:
      - ${AUDIOBOOKS_PATH:-/mnt/files/Mediaserver/Audiobooks}:/audiobooks
      - ${PODCASTS_PATH:-/mnt/files/Mediaserver/Podcasts}:/podcasts
      - ./configs/audiobookshelf:/config
      - ./data/audiobookshelf:/metadata
    environment:
      - TZ=${TZ:-Europe/Berlin}
    networks:
      - hosting
      - content_consumption

