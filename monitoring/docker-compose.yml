networks:
  hosting:
    external: true

services:
  gotify:
    container_name: gotify
    image: gotify/server:3
    restart: unless-stopped
    user: "${UID}:${GID}"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    volumes:
      - ./data/gotify:/app/data
    networks:
      - hosting

  diun:
    container_name: diun
    image: crazymax/diun:latest
    command: serve
    restart: unless-stopped
    volumes:
      - ./data/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info

      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 6 * * *
      - DIUN_WATCH_JITTER=30s

      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true

      - DIUN_NOTIF_GOTIFY_ENDPOINT=${DIUN_NOTIFY_GOTIFY_ENDPOINT}
      - DIUN_NOTIF_GOTIFY_TOKEN=${DIUN_NOTIFY_GOTIFY_TOKEN}
      - DIUN_NOTIF_GOTIFY_PRIORITY=1
      - DIUN_NOTIF_GOTIFY_TIMEOUT=10s
    labels:
      - "diun.enable=true"

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - ./data/uptime_kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - hosting
