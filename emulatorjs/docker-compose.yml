networks:
  hosting:
    external: true

services:
  emulatorjs:
    image: lscr.io/linuxserver/emulatorjs:latest
    container_name: emulatorjs
    restart: unless-stopped
    ports:
      - ${EMULATORJS_ADMIN_PORT:-3000}:3000 # file management
      - ${EMULATORJS_GAME_PORT:-80}:80 # gaming
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./config/emulatorjs:/config
      # - ./data/emulatorjs:/data
      - ${EMULATORJS_DATA_PATH:-/mnt/files/docker_data/emulatorjs}:/data
    networks:
      - hosting
