networks:
  default:
  dbs_postgres:
    external: true
  hosting:
    external: true

services:
  gitea:
    image: gitea/gitea:1.23
    container_name: gitea
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - USER_ID=${UID:-1000}
      - USER_GID=${GID:-1000}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres_gitea:${POSTGRES_PORT:-5432}
      - GITEA__database__NAME=${POSTGRES_DB:?database name required}
      - GITEA__database__USER=${POSTGRES_USER:?database user required}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD:?database password required}
    volumes:
      - ${DATA_DIR:-./data/gitea}/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 10000:3000
      - 222:22
    networks:
      - default
      - hosting
    depends_on:
      - postgres_gitea

  postgres_gitea:
    image: postgres:14
    container_name: postgres_gitea
    restart: unless-stopped
    environment:
      - PGPORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:?database user required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?database password required}
      - POSTGRES_DB=${POSTGRES_DB:?database name required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - default
      - dbs_postgres
