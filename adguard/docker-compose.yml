name: adguardhome

services:
  adguardhome:
    image: adguard/adguardhome:latest
    ports:
      - ${ADGUARD_DNS_PORT:-53}:53/tcp # plain dns over tcp
      - ${ADGUARD_DNS_PORT:-53}:53/udp # plain dns over udp
      - ${ADGUARD_WEB_PORT:-18080}:80/tcp # web interface
      # - ${ADGUARD_WEB_PORT:-18080}:3000/tcp # web setup interface
    volumes:
      - ./data/agh/config:/opt/adguardhome/conf
      - ./data/agh/work:/opt/adguardhome/work
